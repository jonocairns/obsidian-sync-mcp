# Create a .env file to override defaults:
#   COUCHDB_PASSWORD=<strong-password>
#   VAULT_NAME=MyVault
#   MCP_AUTH_TOKEN=<password-for-mcp>
#   MCP_STATELESS=true              (optional)
#   LIVESYNC_USER=livesync          (optional, recommended)
#   LIVESYNC_PASSWORD=<password>    (optional, recommended)

services:
  couchdb:
    image: couchdb:3@sha256:9ea24cbd76522fe845d1c32c7fd1dcfc8a3ba73dcc4817d62f8a7f7f1dfaffe3
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5984:5984"
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./deploy/mcp-with-db/couchdb-init.ini:/opt/couchdb/etc/local.d/livesync.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --user \"$${COUCHDB_USER}:$${COUCHDB_PASSWORD}\" http://127.0.0.1:5984/_up >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: obsidian-sync-mcp:local
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8787:8787"
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidian}
      VAULT_NAME: ${VAULT_NAME:-MyVault}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
      MCP_STATELESS: ${MCP_STATELESS:-false}
      BASE_URL: ${BASE_URL:-http://localhost:8787}
      DATA_DIR: /data
    volumes:
      - mcp_data:/data
    depends_on:
      couchdb:
        condition: service_healthy

volumes:
  couchdb_data:
  mcp_data:
