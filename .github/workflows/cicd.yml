name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Keep release-bearing main/tag runs intact, but stop wasting runner time on
  # superseded revisions of the same pull request.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - run: nix flake check --no-update-lock-file
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Check shell scripts
        run: |
          shellcheck -x \
            .githooks/pre-commit \
            .githooks/pre-push \
            deploy/setup.sh \
            deploy/mcp-with-db/entrypoint.sh \
            scripts/ci/*.sh
      - name: Test release scripts
        run: scripts/ci/release-scripts.test.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high --ignore-registry-errors

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack --dry-run
      - run: pnpm pack
      - name: Smoke-test packaged artifact
        run: scripts/ci/package-smoke.sh ./*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: "*.tgz"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # E2E: start server in local mode, test all tools via MCP protocol
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e

  # E2E: CouchDB mode against a real CouchDB — exercises the LiveSync write
  # path and the Obfuscate Properties auto-detection (issues #4, #10)
  test-couchdb:
    runs-on: ubuntu-latest
    services:
      couchdb:
        image: couchdb:3@sha256:9ea24cbd76522fe845d1c32c7fd1dcfc8a3ba73dcc4817d62f8a7f7f1dfaffe3
        ports:
          - 5985:5984
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: test
        options: >-
          --health-cmd "curl -sf http://localhost:5984/"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:couchdb

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - name: Build and smoke-test container variants
        run: scripts/ci/docker-smoke.sh

  # Branch protection should require this one stable context rather than a
  # brittle list of matrix and integration-test job names.
  ci-required:
    if: always()
    needs: [lint, audit, build, test, test-e2e, test-couchdb, docker-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every required check passed
        shell: bash
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.audit.result }}" = success
          test "${{ needs.build.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.test-e2e.result }}" = success
          test "${{ needs.test-couchdb.result }}" = success
          test "${{ needs.docker-smoke.result }}" = success

  release-please:
    # PR maintenance may use the current main head only after that head's run
    # has passed every gate. Release creation is stricter: it runs only when
    # this exact successful SHA merged the pending Release Please PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-required
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_context: ${{ steps.context.outputs.release-context }}
      release_created: ${{ steps.github-release.outputs.release_created }}
      release_sha: ${{ steps.github-release.outputs.sha }}
      tag_name: ${{ steps.github-release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: context
        name: Check release context
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/release-context.sh
      - name: Create or update release PR
        if: steps.context.outputs.update-pr == 'true' && steps.context.outputs.release-context != 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          skip-github-release: true
      - id: github-release
        name: Create tag and GitHub Release
        if: steps.context.outputs.create-release == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          skip-github-pull-request: true

  release-artifact:
    if: >-
      always() &&
      needs.lint.result == 'success' &&
      needs.audit.result == 'success' &&
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      needs.test-e2e.result == 'success' &&
      needs.test-couchdb.result == 'success' &&
      needs.docker-smoke.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        needs.release-please.outputs.release_context == 'true'
      )
    needs: [lint, audit, build, test, test-e2e, test-couchdb, docker-smoke, release-please]
    runs-on: ubuntu-latest
    concurrency:
      group: release-asset-${{ needs.release-please.outputs.tag_name || github.ref_name || github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      stable: ${{ steps.release.outputs.stable }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - id: release
        name: Verify tag and GitHub Release
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/verify-release-artifact.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack --dry-run
      - run: pnpm pack
      - name: Upload package to existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: scripts/ci/upload-release-asset.sh "$RELEASE_TAG"

  publish-docker:
    if: needs.release-artifact.outputs.stable == 'true'
    needs: release-artifact
    runs-on: ubuntu-latest
    concurrency:
      group: publish-docker-${{ needs.release-artifact.outputs.tag_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release-artifact.outputs.tag_name }}
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - id: publication
        name: Check for an existing multi-architecture image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-artifact.outputs.tag_name }}
        run: scripts/ci/check-container-publication.sh
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: steps.publication.outputs.publish == 'true'
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: build-push
        if: steps.publication.outputs.publish == 'true'
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-artifact.outputs.tag_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Record immutable container reference in GitHub Release
        if: steps.publication.outputs.document == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest || steps.publication.outputs.digest }}
          RELEASE_TAG: ${{ needs.release-artifact.outputs.tag_name }}
        run: scripts/ci/update-release-container-notes.sh "$RELEASE_TAG" "$IMAGE_DIGEST"
