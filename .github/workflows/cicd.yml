name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - run: nix flake check --no-update-lock-file
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: shellcheck -x .githooks/pre-commit .githooks/pre-push deploy/setup.sh deploy/mcp-with-db/entrypoint.sh scripts/ci/docker-smoke.sh scripts/ci/update-release-container-notes.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack --dry-run
      - run: pnpm pack
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: package
          path: "*.tgz"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.13 segfaults in better-sqlite3-multiple-ciphers; keep the exact
        # supported floor and the other supported LTS line under test.
        dev-shell: ["node22-min", "node24"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - run: nix develop ".#${{ matrix.dev-shell }}" --command pnpm install --frozen-lockfile
      - run: nix develop ".#${{ matrix.dev-shell }}" --command pnpm test

  # E2E: start server in local mode, test all tools via MCP protocol
  test-e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e

  # E2E: CouchDB mode against a real CouchDB — exercises the LiveSync write
  # path and the Obfuscate Properties auto-detection (issues #4, #10)
  test-couchdb:
    runs-on: ubuntu-latest
    needs: build
    services:
      couchdb:
        image: couchdb:3@sha256:9ea24cbd76522fe845d1c32c7fd1dcfc8a3ba73dcc4817d62f8a7f7f1dfaffe3
        ports:
          - 5985:5984
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: test
        options: >-
          --health-cmd "curl -sf http://localhost:5984/"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:couchdb

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - name: Build and smoke-test container variants
        run: scripts/ci/docker-smoke.sh

  release-please:
    # PR maintenance may use the current main head only after that head's run
    # has passed every gate. Release creation is stricter: it runs only when
    # this exact successful SHA merged the pending Release Please PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, audit, build, test, test-e2e, test-couchdb, docker-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_context: ${{ steps.context.outputs.release-context }}
      release_created: ${{ steps.github-release.outputs.release_created }}
      release_sha: ${{ steps.github-release.outputs.sha }}
      tag_name: ${{ steps.github-release.outputs.tag_name }}
    steps:
      - id: context
        name: Check release context
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "$MAIN_SHA" == "$EXPECTED_SHA" ]]; then
            echo "update-pr=true" >>"$GITHUB_OUTPUT"
          else
            echo "update-pr=false" >>"$GITHUB_OUTPUT"
            echo "main advanced to $MAIN_SHA; its own CI run will update the release PR."
          fi

          pending_release_pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/pulls" \
            --jq ".[] | select(.base.ref == \"main\" and .merge_commit_sha == \"${EXPECTED_SHA}\" and any(.labels[]?; .name == \"autorelease: pending\")) | .number")"
          tagged_release_pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/pulls" \
            --jq ".[] | select(.base.ref == \"main\" and .merge_commit_sha == \"${EXPECTED_SHA}\" and any(.labels[]?; .name == \"autorelease: tagged\")) | .number")"
          if [[ -n "$pending_release_pr" ]]; then
            echo "create-release=true" >>"$GITHUB_OUTPUT"
            echo "release-context=true" >>"$GITHUB_OUTPUT"
            echo "Commit $EXPECTED_SHA merged pending Release Please PR #$pending_release_pr."
          elif [[ -n "$tagged_release_pr" ]]; then
            echo "create-release=false" >>"$GITHUB_OUTPUT"
            echo "release-context=true" >>"$GITHUB_OUTPUT"
            echo "Commit $EXPECTED_SHA merged tagged Release Please PR #$tagged_release_pr; recovering downstream release work."
          else
            echo "create-release=false" >>"$GITHUB_OUTPUT"
            echo "release-context=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Create or update release PR
        if: steps.context.outputs.update-pr == 'true' && steps.context.outputs.release-context != 'true'
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          skip-github-release: true
      - id: github-release
        name: Create tag and GitHub Release
        if: steps.context.outputs.create-release == 'true'
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          skip-github-pull-request: true

  release-artifact:
    if: >-
      always() &&
      needs.lint.result == 'success' &&
      needs.audit.result == 'success' &&
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      needs.test-e2e.result == 'success' &&
      needs.test-couchdb.result == 'success' &&
      needs.docker-smoke.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        needs.release-please.outputs.release_context == 'true'
      )
    needs: [lint, audit, build, test, test-e2e, test-couchdb, docker-smoke, release-please]
    runs-on: ubuntu-latest
    concurrency:
      group: release-asset-${{ needs.release-please.outputs.tag_name || github.ref_name || github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      stable: ${{ steps.release.outputs.stable }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - id: release
        name: Verify tag and GitHub Release
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v${PACKAGE_VERSION}"
          fi
          if [[ "$RELEASE_TAG" != "v${PACKAGE_VERSION}" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$TAG_SHA" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Tag $RELEASE_TAG does not point to the checked commit"
            exit 1
          fi
          if [[ -n "$EXPECTED_RELEASE_SHA" && "$(git rev-parse HEAD)" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "::error::Tag $RELEASE_TAG does not point to the Release Please output SHA"
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            echo "::error::Expected GitHub Release $RELEASE_TAG does not exist"
            exit 1
          fi
          echo "tag_name=$RELEASE_TAG" >>"$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *rc* ]]; then
            echo "stable=false" >>"$GITHUB_OUTPUT"
          else
            echo "stable=true" >>"$GITHUB_OUTPUT"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack --dry-run
      - run: pnpm pack
      - name: Upload package to existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          shopt -s nullglob
          packages=(*.tgz)
          if (( ${#packages[@]} != 1 )); then
            echo "::error::Expected exactly one .tgz package, found ${#packages[@]}"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${packages[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish-docker:
    if: needs.release-artifact.outputs.stable == 'true'
    needs: release-artifact
    runs-on: ubuntu-latest
    concurrency:
      group: publish-docker-${{ needs.release-artifact.outputs.tag_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release-artifact.outputs.tag_name }}
          submodules: recursive
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
          extra-conf: experimental-features = nix-command flakes
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: publication
        name: Check for an existing multi-architecture image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-artifact.outputs.tag_name }}
        run: |
          if ! release_body="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body // ""')"; then
            echo "::error::Expected GitHub Release $RELEASE_TAG does not exist"
            exit 1
          fi

          image_tag="ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_TAG}"
          inspect_error="$(mktemp)"
          trap 'rm -f "$inspect_error"' EXIT
          if manifest_json="$(docker buildx imagetools inspect "$image_tag" \
            --format '{{json .Manifest}}' 2>"$inspect_error")"; then
            if ! existing_digest="$(node -e '
              const manifest = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const platforms = new Set((manifest.manifests || []).map(
                entry => `${entry.platform?.os}/${entry.platform?.architecture}`
              ));
              if (!platforms.has("linux/amd64") || !platforms.has("linux/arm64")) {
                throw new Error("version tag is not a linux/amd64 + linux/arm64 image index");
              }
              if (!/^sha256:[0-9a-f]{64}$/.test(manifest.digest || "")) {
                throw new Error("registry returned an invalid image-index digest");
              }
              process.stdout.write(manifest.digest);
            ' <<<"$manifest_json")"; then
              echo "::error::Existing GHCR tag $image_tag is not the expected multi-architecture image"
              exit 1
            fi
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "digest=$existing_digest" >>"$GITHUB_OUTPUT"
            if grep -Fq "${image_tag}@${existing_digest}" <<<"$release_body"; then
              echo "document=false" >>"$GITHUB_OUTPUT"
              echo "Release already records the published multi-architecture image."
            else
              echo "document=true" >>"$GITHUB_OUTPUT"
              echo "Recovering release notes from existing GHCR digest $existing_digest."
            fi
          elif grep -Eiq 'manifest unknown|name unknown|not found' "$inspect_error"; then
            echo "publish=true" >>"$GITHUB_OUTPUT"
            echo "document=true" >>"$GITHUB_OUTPUT"
          else
            cat "$inspect_error" >&2
            echo "::error::Could not determine whether GHCR tag $image_tag already exists"
            exit 1
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: steps.publication.outputs.publish == 'true'
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build-push
        if: steps.publication.outputs.publish == 'true'
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-artifact.outputs.tag_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Record immutable container reference in GitHub Release
        if: steps.publication.outputs.document == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest || steps.publication.outputs.digest }}
          RELEASE_TAG: ${{ needs.release-artifact.outputs.tag_name }}
        run: scripts/ci/update-release-container-notes.sh "$RELEASE_TAG" "$IMAGE_DIGEST"
